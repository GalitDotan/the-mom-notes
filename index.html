<!doctype html>
<!-- The default theme (see src/features/theme/themes.ts; palettes in
     src/styles/themes.css). data-appearance must match the theme. -->
<html lang="en" data-theme="velvet" data-appearance="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saga's Scout</title>
  <script>
    // Applies the theme the user chose before anything paints, so it never
    // flashes the default first. src/features/theme/themes.ts saves it under
    // storageKeys.theme ("theme") and re-checks it once the app has loaded.
    try {
      var savedTheme = JSON.parse(localStorage.getItem("theme") || "null");
      if (savedTheme && /^[a-z-]+$/.test(savedTheme.id) &&
        (savedTheme.appearance === "light" || savedTheme.appearance === "dark")) {
        document.documentElement.dataset.theme = savedTheme.id;
        document.documentElement.dataset.appearance = savedTheme.appearance;
      }
    } catch (error) {
      // Unreadable storage: keep the default theme.
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
